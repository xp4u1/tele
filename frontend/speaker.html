<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Speaker View</title>
    <link rel="stylesheet" href="src/main.css" />
    <link rel="stylesheet" href="src/speaker.css" />
    <script type="module" src="src/speaker/main.ts"></script>
  </head>
  <body
    class="flex flex-col items-center px-52 py-24 dark:bg-black dark:text-white"
  >
    <div
      id="empty-markdown"
      hidden
      class="fixed inset-0 flex items-center justify-center p-6"
    >
      <div class="max-w-xl text-left text-lg">
        <h1 class="mb-2 text-2xl font-semibold">The markdown file is empty</h1>
        <p class="mb-4">Add your slides to the markdown file, for example:</p>
        <pre
          class="overflow-x-auto rounded-lg bg-neutral-100 p-4 text-neutral-900 dark:bg-neutral-900 dark:text-neutral-100"
        ><code>---
pdf: your_presentation.pdf
---

# Headings are not shown

Only paragraphs are shown, one step each.

A line with --- on its own starts a new slide.

---

This paragraph is on slide 2.</code></pre>
      </div>
    </div>

    <div
      id="viewport"
      class="max-w-6xl font-medium wrap-break-word text-4xl leading-13"
    >
      <div
        id="block-container"
        class="flex flex-col gap-6 transition-transform duration-200 ease-in-out"
        style="transform: translateY(0)"
      ></div>
    </div>

    <div class="hidden">
      <div
        id="template-block"
        class="pl-5 border-l-4 border-l-white dark:border-l-black"
      ></div>
    </div>
  </body>
</html>
